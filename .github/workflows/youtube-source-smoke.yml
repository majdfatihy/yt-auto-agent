name: YouTube Source Authentication Smoke Test

on:
  push:
    branches: [main]
    paths:
      - youtube_source.py
      - agent.py
      - .github/workflows/youtube-source-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  youtube_source_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install minimum YouTube dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install 'yt-dlp[default]>=2026.10.26' 'bgutil-ytdlp-pot-provider==2.0.2' requests
          python -m py_compile youtube_source.py transcription_pipeline.py agent.py
      - name: Start local PO token provider
        run: |
          docker run -d --init --name bgutil-smoke -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:2.0.2
          for attempt in $(seq 1 20); do
            if curl --silent --max-time 2 http://127.0.0.1:4416/ >/dev/null 2>&1; then
              echo 'PO_TOKEN_PROVIDER_READY: YES'
              exit 0
            fi
            sleep 2
          done
          echo 'PO_TOKEN_PROVIDER_READY: NO'
          exit 1
      - name: Set authenticated route and verify proxy reachability
        env:
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          python - <<'PY'
          import os
          import shlex
          from pathlib import Path
          from urllib.parse import urlsplit
          import requests

          proxy = os.getenv('YTDLP_PROXY', '').strip()
          if proxy:
              parsed = urlsplit(proxy)
              if parsed.scheme not in {'http', 'https', 'socks5', 'socks5h'} or not parsed.hostname:
                  raise SystemExit('YTDLP_PROXY_INVALID')
              cfg = Path.home() / '.config' / 'yt-dlp' / 'config'
              cfg.parent.mkdir(parents=True, exist_ok=True)
              cfg.write_text('--proxy ' + shlex.quote(proxy) + '\n', encoding='utf-8')
              cfg.chmod(0o600)
              try:
                  response = requests.get(
                      'https://www.youtube.com/robots.txt',
                      proxies={'http': proxy, 'https': proxy},
                      timeout=(8, 12),
                  )
                  print('YTDLP_PROXY_CONNECTIVITY: HTTP_' + str(response.status_code))
              except requests.RequestException as exc:
                  print('YTDLP_PROXY_CONNECTIVITY: ERROR_' + type(exc).__name__)
          else:
              print('YTDLP_PROXY_CONNECTIVITY: NOT_CONFIGURED')
          cookies = os.getenv('YT_COOKIES', '').strip()
          if cookies:
              Path('cookies.txt').write_text(cookies.replace('\\n', '\n') + '\n', encoding='utf-8')
              Path('cookies.txt').chmod(0o600)
          print('YOUTUBE_COOKIES_CONFIGURED: ' + ('YES' if cookies else 'NO'))
          PY
      - name: Diagnose rejected video against previously working control
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from youtube_source import (
              download_youtube_audio, YouTubeSourceError, _base_command, _classify_error
          )
          cookies = 'cookies.txt' if Path('cookies.txt').is_file() else None
          failed = False
          try:
              audio = download_youtube_audio(
                  'https://youtu.be/DggHblFwsC4', cookies_file=cookies)
              print('YOUTUBE_AUTH_SMOKE_TEST: PASS; AUDIO_BYTES=' + str(audio.stat().st_size))
          except YouTubeSourceError as exc:
              failed = True
              print('YOUTUBE_AUTH_SMOKE_TEST: FAIL; CODE=' + str(exc))

          control_cmd = _base_command(player_clients='mweb') + [
              '--simulate', '--format', 'ba/b', 'https://youtu.be/6DKICQ8BL-8']
          try:
              result = subprocess.run(control_cmd, capture_output=True, text=True, timeout=75)
              code = 'PASS' if result.returncode == 0 else _classify_error(
                  (result.stderr or '') + '\n' + (result.stdout or ''))
              print('CONTROL_PREVIOUSLY_WORKING_VIDEO: ' + code)
          except subprocess.TimeoutExpired:
              print('CONTROL_PREVIOUSLY_WORKING_VIDEO: TIMEOUT')

          if cookies and failed:
              cookie_cmd = _base_command(cookies, player_clients='mweb') + [
                  '--verbose', '--simulate', 'https://youtu.be/DggHblFwsC4']
              try:
                  result = subprocess.run(cookie_cmd, capture_output=True, text=True, timeout=60)
                  output = (result.stderr or '') + '\n' + (result.stdout or '')
                  recognized = 'Found YouTube account cookies' in output
                  print('YOUTUBE_ACCOUNT_COOKIES_RECOGNIZED_BY_YTDLP: ' +
                        ('YES' if recognized else 'NO_OR_UNKNOWN'))
              except subprocess.TimeoutExpired:
                  print('YOUTUBE_ACCOUNT_COOKIES_RECOGNIZED_BY_YTDLP: CHECK_TIMEOUT')
          if failed:
              raise SystemExit(1)
          PY
