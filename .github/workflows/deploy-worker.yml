# Keep the live Cloudflare Telegram webhook in sync with worker.js when
# its existing deployment credentials are already present on GitHub.
# If credentials are absent, report explicitly and do not claim deployment.
name: Deploy Telegram Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-telegram-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report missing credentials without changing the live bot
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo 'LIVE_WORKER_NOT_DEPLOYED: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID missing.'
          echo 'The GitHub code was updated, but Cloudflare still needs an authorized deployment.'
      - name: Deploy worker.js to the existing Cloudflare Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          npx --yes wrangler@4 deploy --config wrangler.toml
          echo 'LIVE_WORKER_DEPLOYED: existing Telegram webhook updated.'
      - name: Enable one-tap preview callback after a verified deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import requests
          token = os.getenv('GH_PAT', '')
          if not token:
              print('ONE_TAP_FLAG_UNCHANGED: GH_PAT not configured; old approval remains available.')
              raise SystemExit(0)
          root = f"https://api.github.com/repos/{os.environ['REPO']}/actions/variables"
          headers = {'Authorization': f'Bearer {token}',
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          data = {'name': 'TELEGRAM_ONE_TAP_ENABLED', 'value': 'true'}
          check = requests.get(root + '/' + data['name'], headers=headers, timeout=20)
          if check.status_code == 404:
              result = requests.post(root, headers=headers, json=data, timeout=20)
              expected = 201
          else:
              check.raise_for_status()
              result = requests.patch(root + '/' + data['name'], headers=headers,
                                      json={'value': 'true'}, timeout=20)
              expected = 204
          if result.status_code != expected:
              raise SystemExit('ONE_TAP_FLAG_UPDATE_FAILED_HTTP_' + str(result.status_code))
          print('ONE_TAP_FLAG_ENABLED: live Cloudflare deployment confirmed.')
          PY
