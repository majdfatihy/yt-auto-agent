# Keep the live Cloudflare Telegram webhook in sync with worker.js when
# its existing deployment credentials are already present on GitHub.
# If credentials are absent, report explicitly and do not claim deployment.
name: Deploy Telegram Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-telegram-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report missing credentials without changing the live bot
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo 'LIVE_WORKER_NOT_DEPLOYED: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID missing.'
          echo 'The GitHub code was updated, but Cloudflare still needs an authorized deployment.'
      - name: Deploy worker.js to the existing Cloudflare Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          npx --yes wrangler@4 deploy --config wrangler.toml
          echo 'LIVE_WORKER_DEPLOYED: existing Telegram webhook updated.'
