name: Verify Telegram Bot Changes
on:
  push:
    branches:
      - fix/inline-buttons-oauth-recovery
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: node --check worker.js
      - name: Python syntax
        run: python -m py_compile agent.py approved_publish.py clip_planner.py reel_metadata.py text_ai.py reel_title_quality.py
      - name: Worker offline regression tests
        run: |
          node tests/test_worker_stage2.mjs
          node tests/test_worker_approval.mjs
          node tests/test_worker_buttons.mjs
          node tests/test_worker_webhook.mjs
      - name: Publishing offline tests
        run: |
          python -m pip install requests
          python -m unittest discover -s tests -p test_approved_publish.py -v
          python -m unittest discover -s tests -p test_reel_metadata.py -v
          python -m unittest discover -s tests -p test_text_ai_titles.py -v
          python -m unittest discover -s tests -p test_stage1.py -v
          python -m unittest discover -s tests -p test_stage2.py -v
