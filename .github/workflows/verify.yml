name: Verify Telegram Bot Changes
on:
  push:
    branches:
      - fix/inline-buttons-oauth-recovery
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: node --check worker.js
      - name: Python syntax
        run: python -m py_compile agent.py approved_publish.py clip_planner.py reel_metadata.py text_ai.py reel_title_quality.py source_video_info.py reel_history.py reel_full_plan.py reel_schedule.py telegram_reel_details.py reel_video_layout.py reel_topics.py reel_transcript_store.py direct_publish.py
      - name: Worker offline regression tests
        run: |
          node tests/test_worker_stage2.mjs
          node tests/test_worker_approval.mjs
          node tests/test_worker_buttons.mjs
          node tests/test_worker_webhook.mjs
          node tests/test_worker_fastpath.mjs
          node tests/test_worker_bulk.mjs
          node tests/test_worker_continue.mjs
          node tests/test_worker_topic_schedule.mjs
      - name: Publishing offline tests
        run: |
          python -m pip install requests
          python -m unittest discover -s tests -p test_approved_publish.py -v
          python -m unittest discover -s tests -p test_reel_metadata.py -v
          python -m unittest discover -s tests -p test_text_ai_titles.py -v
          python -m unittest discover -s tests -p test_stage1.py -v
          python -m unittest discover -s tests -p test_stage2.py -v
          python -m unittest discover -s tests -p test_source_video_info.py -v
          python -m unittest discover -s tests -p test_preview_button_rollout.py -v
          python -m unittest discover -s tests -p test_reel_history.py -v
          python -m unittest discover -s tests -p test_reel_full_plan.py -v
          python -m unittest discover -s tests -p test_reel_schedule.py -v
          python -m unittest discover -s tests -p test_telegram_reel_details.py -v
          python -m unittest discover -s tests -p test_reel_video_layout.py -v
          python -m unittest discover -s tests -p test_reel_topics.py -v
          python -m unittest discover -s tests -p test_direct_publish.py -v
