
name: YouTube Reels & SEO Agent

on:
  repository_dispatch:
    types: [process_video]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط فيديو اليوتيوب'
        required: true

concurrency:
  # Serialize actions for the same approval plan: a second /publish cannot race.
  group: yt-agent-v2-${{ github.event.client_payload.clip_plan_ref || github.event.client_payload.video_url || github.run_id }}
  cancel-in-progress: false

jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: سحب الأكواد
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون الرسمية
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Deno for yt-dlp EJS
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: تثبيت أداة المونتاج والمكتبات
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m yt_dlp --version
          deno --version
          ffmpeg -version | head -n 1

      - name: Start localhost BgUtils PO Token server
        if: ${{ !contains(github.event.client_payload.video_url || github.event.inputs.video_url, 'drive.google.com') }}
        run: |
          docker run -d --init --name bgutil-provider \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:2.0.2
          for attempt in $(seq 1 20); do
            if curl --silent --show-error --max-time 2 http://127.0.0.1:4416/ >/dev/null 2>&1; then
              echo "PO_TOKEN_PROVIDER_READY: YES"
              exit 0
            fi
            sleep 2
          done
          echo "PO_TOKEN_PROVIDER_READY: NO"
          docker logs --tail 35 bgutil-provider
          exit 1

      - name: Configure private yt-dlp network route
        if: ${{ !contains(github.event.client_payload.video_url || github.event.inputs.video_url, 'drive.google.com') }}
        env:
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
        run: |
          python - <<'PY'
          import os
          import shlex
          from pathlib import Path
          from urllib.parse import urlsplit

          proxy = os.getenv('YTDLP_PROXY', '').strip()

          if proxy:
              url = urlsplit(proxy)

              if (
                  url.scheme not in {
                      'http', 'https',
                      'socks5', 'socks5h'
                  }
                  or not url.hostname
                  or '\n' in proxy
                  or '\r' in proxy
              ):
                  raise SystemExit('YTDLP_PROXY_INVALID')

              config = (
                  Path.home()
                  / '.config'
                  / 'yt-dlp'
                  / 'config'
              )

              config.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              config.write_text(
                  '--proxy ' + shlex.quote(proxy) + '\n',
                  encoding='utf-8'
              )

              config.chmod(0o600)

              print('YTDLP_PROXY_CONFIGURED: YES')
          else:
              print('YTDLP_PROXY_CONFIGURED: NO')
          PY

      - name: تثبيت خط Mikhak Black للمعاينة فقط
        if: ${{ github.event.client_payload.agent_action == 'preview' || github.event.client_payload.agent_action == 'direct_publish' || (github.event.client_payload.agent_action || 'prepare') == 'prepare' }}
        run: python scripts/install_mikhak.py

      - name: تشغيل الوكيل الذكي
        env:
          VIDEO_URL: ${{ github.event.client_payload.video_url || github.event.inputs.video_url }}
          AGENT_ACTION: ${{ github.event.client_payload.agent_action || 'prepare' }}
          CLIP_IDS: ${{ github.event.client_payload.clip_ids || '' }}
          CLIP_OPTIONS_JSON: ${{ github.event.client_payload.clip_options || '{}' }}
          CLIP_PLAN_REF: ${{ github.event.client_payload.clip_plan_ref || '' }}
          REEL_MAX_SECONDS: ${{ github.event.client_payload.max_seconds || '59' }}

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}

          TRANSCRIPTION_PROVIDERS: groq,deepgram,assemblyai,gemini

          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}

          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

          YT_COOKIES: ${{ secrets.YT_COOKIES }}

          SOURCE_VIDEO_FILE: ${{ github.event.client_payload.source_video_file || '' }}
          TELEGRAM_FILE_ID: ${{ github.event.client_payload.telegram_file_id || '' }}

          YT_PRIVACY_STATUS: ${{ github.event.client_payload.privacy || 'private' }}
          TELEGRAM_ONE_TAP_ENABLED: ${{ vars.TELEGRAM_ONE_TAP_ENABLED || 'false' }}

        run: python agent.py

      - name: Store exact preview files for subsequent approval
        if: ${{ github.event.client_payload.agent_action == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}
          path: previews/
          if-no-files-found: error
          retention-days: 14
