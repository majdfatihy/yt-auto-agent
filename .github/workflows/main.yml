name: YouTube Reels & SEO Agent

on:
  repository_dispatch:
    types: [process_video]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط فيديو اليوتيوب'
        required: true

jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: سحب الأكواد
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون الرسمية
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: تثبيت أداة المونتاج والمكتبات
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: تشغيل الوكيل الذكي
        env:
          VIDEO_URL: ${{ github.event.client_payload.video_url || github.event.inputs.video_url }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python agent.py
