
name: YouTube Reels & SEO Agent

on:
  repository_dispatch:
    types: [process_video]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط فيديو اليوتيوب'
        required: true

jobs:
  build_and_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: سحب الأكواد
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون الرسمية
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Deno for yt-dlp EJS
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: تثبيت أداة المونتاج والمكتبات
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m yt_dlp --version
          deno --version
          ffmpeg -version | head -n 1

      - name: تثبيت خط Mikhak Black للمعاينة فقط
        if: ${{ github.event.client_payload.agent_action == 'preview' }}
        run: python scripts/install_mikhak.py

      - name: تشغيل الوكيل الذكي
        env:
          VIDEO_URL: ${{ github.event.client_payload.video_url || github.event.inputs.video_url }}
          AGENT_ACTION: ${{ github.event.client_payload.agent_action || 'prepare' }}
          CLIP_IDS: ${{ github.event.client_payload.clip_ids || '' }}
          CLIP_PLAN_REF: ${{ github.event.client_payload.clip_plan_ref || '' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          TRANSCRIPTION_PROVIDERS: groq,deepgram,assemblyai,gemini
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          SOURCE_VIDEO_FILE: ${{ github.event.client_payload.source_video_file || '' }}
          TELEGRAM_FILE_ID: ${{ github.event.client_payload.telegram_file_id || '' }}
          YT_PRIVACY_STATUS: private
        run: python agent.py

      - name: Store exact preview files for subsequent approval
        if: ${{ github.event.client_payload.agent_action == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}
          path: previews/
          if-no-files-found: error
          retention-days: 14
